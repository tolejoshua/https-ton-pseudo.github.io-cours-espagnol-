# Déploiement Netlify
# Si le site est dans un sous-dossier du dépôt, indiquer "diagnostic-paris11" comme Base directory.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Playwright ne sert qu’aux outils locaux (images, tests) : pas de navigateur à télécharger sur Netlify
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"

# En-têtes de sécurité et de cache
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

